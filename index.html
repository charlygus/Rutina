<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rutina</title>
    
    <link rel="icon" type="image/png" href="favicon.png?v=2">
    <link rel="apple-touch-icon" href="favicon.png">
    
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/charts/loader.js"></script>
</head>
<body>

    <header class="minimal-header" id="main-header">
        <div class="header-content">
            <h1>RUTINA</h1>
            <div class="week-controls">
                <button id="prev-week" onclick="changeWeek(-1)">←</button>
                <span id="current-week-label">Cargando...</span>
                <button id="next-week" onclick="changeWeek(1)">→</button>
            </div>
        </div>
    </header>

    <main>
        <div class="tabs-minimal" id="main-tabs">
            <button class="tab-link active" onclick="showTab('menu')">Menú</button>
            <button class="tab-link" onclick="showTab('shopping')">Compra</button>
            <button class="tab-link" onclick="showTab('weight')">Peso</button>
        </div>

        <div id="menu-view" class="tab-content active">
            <div id="days-container"></div>
            
            <div id="recipe-view" class="hidden-view">
                <button class="back-btn" onclick="closeRecipe()">← Volver al menú</button>
                
                <h2 id="recipe-day-title">Día</h2>

                <div class="recipe-card" id="card-lunch">
                    <div class="recipe-label">☀️ Comida</div>
                    <div class="recipe-dish" id="recipe-lunch-name">...</div>
                    <div class="recipe-steps" id="recipe-lunch-steps" style="white-space: pre-wrap;">...</div>
                </div>

                <div class="recipe-card" id="card-dinner">
                    <div class="recipe-label">🌙 Cena</div>
                    <div class="recipe-dish" id="recipe-dinner-name">...</div>
                    <div class="recipe-steps" id="recipe-dinner-steps" style="white-space: pre-wrap;">...</div>
                </div>
            </div>
        </div>

        <div id="shopping-view" class="tab-content">
            <div class="minimal-section" style="background: #f8f9fa; border-radius: 12px; margin: 10px 15px;">
                <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 10px;">
                    <input type="checkbox" id="supermarket-mode" onchange="renderShopping()" style="width: 20px; height: 20px;">
                    <span style="font-weight: 800; font-size: 0.8rem;">📦 MODO SUPERMERCADO (S3 + S4)</span>
                </label>
            </div>

            <div class="minimal-section">
                <h3>Lista de la compra</h3>
                <div id="shopping-list"></div> </div>
            
            <div class="minimal-section">
                <h3>Básicos Despensa</h3>
                <ul class="checklist-minimal">
                    <li><input type="checkbox" id="b1" onchange="saveBasicStatus('b1', this.checked)"><label for="b1"> Aceite de Oliva</label></li>
                    <li><input type="checkbox" id="b2" onchange="saveBasicStatus('b2', this.checked)"><label for="b2"> Sal / Especias</label></li>
                    <li><input type="checkbox" id="b3" onchange="saveBasicStatus('b3', this.checked)"><label for="b3"> Café / Té</label></li>
                    <li><input type="checkbox" id="b4" onchange="saveBasicStatus('b4', this.checked)"><label for="b4"> Huevos</label></li>
                </ul>
            </div>
        </div> 

        <div id="weight-view" class="tab-content">
            <div class="weight-summary">
                <div class="kpi-box">
                    <span class="kpi-label">Último Peso</span>
                    <span class="kpi-value" id="last-weight">-- kg</span>
                </div>
                <div class="kpi-box">
                    <span class="kpi-label">Tendencia</span>
                    <span class="kpi-value" id="weight-trend">--</span>
                </div>
            </div>

            <div id="chart_div" class="chart-container"></div>

            <div class="weight-input-section">
                <h3>Registrar Progreso</h3>
                <div class="input-group">
                    <input type="number" id="weight-input" placeholder="Ej: 75.5" step="0.1">
                    <button onclick="enviarPeso()" id="btn-save-weight">Guardar</button>
                </div>
                <p id="weight-msg" class="status-msg"></p>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
