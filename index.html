<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rutina</title>
    <link rel="icon" type="image/png" href="favicon.png?v=2">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/charts/loader.js"></script>
</head>
<body>

    <div id="loading-screen">
        <img src="favicon.png" alt="Cargando..." class="loading-logo">
    </div>

    <header class="minimal-header">
        <div class="header-content">
            <h1>RUTINA</h1>
            <div class="week-controls">
                <button id="prev-week">←</button>
                <span id="current-week-label">...</span>
                <button id="next-week">→</button>
            </div>
        </div>
    </header>

    <main id="main-container">
        <div class="tabs-minimal">
            <button class="tab-link active" onclick="showTab('menu')">Menú</button>
            <button class="tab-link" onclick="showTab('shopping')">Compra</button>
            <button class="tab-link" onclick="showTab('weight')">Peso</button>
        </div>

        <div id="menu-view" class="tab-content active">
            <div id="days-container"></div>
        </div>

        <div id="shopping-view" class="tab-content">
            <div class="supermarket-control">
                <span class="control-label">Modo Supermercado (2 Sem.)</span>
                <label class="switch">
                    <input type="checkbox" id="super-mode-toggle" onchange="toggleSuperMode()">
                    <span class="slider"></span>
                </label>
            </div>
            <p id="shopping-subtitle" class="section-subtitle">Cargando ingredientes...</p>
            <div class="minimal-section">
                <ul id="shopping-list" class="checklist-minimal"></ul>
            </div>
        </div>

        <div id="weight-view" class="tab-content">
            <div class="weight-summary">
                <div class="kpi-box">
                    <span class="kpi-label">Último Peso</span>
                    <span class="kpi-value" id="last-weight">-- kg</span>
                </div>
                <div class="kpi-box">
                    <span class="kpi-label">Tendencia</span>
                    <span class="kpi-value" id="weight-trend">--</span>
                </div>
            </div>
            <div id="chart_div" class="chart-container"></div>
            <div class="weight-input-section">
                <h3>Registrar Progreso</h3>
                <div class="input-group">
                    <input type="number" id="weight-input" placeholder="Ej: 75.5" step="0.1">
                    <button onclick="enviarPeso()" id="btn-save-weight">Guardar</button>
                </div>
                <p id="weight-msg" class="status-msg"></p>
            </div>
        </div>
    </main>

    <div id="recipe-modal" class="modal-overlay" onclick="cerrarReceta()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2 id="modal-title">Plato</h2>
                <button class="close-btn" onclick="cerrarReceta()">×</button>
            </div>
            <div class="modal-body" id="modal-body">...</div>
            <button class="modal-ok-btn" onclick="cerrarReceta()">Entendido</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
