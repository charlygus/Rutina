<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rutina</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/charts/loader.js"></script>
</head>
<body>

    <header class="minimal-header">
        <div class="header-content">
            <h1>RUTINA</h1>
            <div class="week-controls">
                <button onclick="changeWeek(-1)">←</button>
                <span id="current-week-label">...</span>
                <button onclick="changeWeek(1)">→</button>
            </div>
        </div>
    </header>

    <nav class="tabs-minimal">
        <button class="tab-link active" onclick="showTab('menu')">Menú</button>
        <button class="tab-link" onclick="showTab('shopping')">Compra</button>
        <button class="tab-link" onclick="showTab('weight')">Peso</button>
    </nav>

    <main>
        <div id="menu-view" class="tab-content active">
            <div id="days-container"></div>
            
            <div id="recipe-view" class="recipe-overlay">
                <div class="recipe-sheet">
                    <button class="close-bar" onclick="closeRecipe()"></button>
                    <h2 id="recipe-day-title">Día</h2>
                    <div id="recipe-container">
                        </div>
                </div>
            </div>
        </div>

        <div id="shopping-view" class="tab-content">
            <div class="shopping-container">
                <div class="super-toggle-card">
                    <input type="checkbox" id="supermarket-mode" onchange="renderShopping()">
                    <label for="supermarket-mode">📦 MODO SUPERMERCADO (S3 + S4)</label>
                </div>
                <div id="shopping-list"></div>
            </div>
        </div>

        <div id="weight-view" class="tab-content">
            <div class="weight-card">
                <div class="kpi-grid">
                    <div class="kpi">
                        <span class="label">Último Peso</span>
                        <span class="value" id="last-weight">-- kg</span>
                    </div>
                    <div class="kpi">
                        <span class="label">Tendencia</span>
                        <span class="value" id="weight-trend">--</span>
                    </div>
                </div>
                <div id="chart_div" class="chart-container"></div>
                <div class="weight-input-group">
                    <input type="number" id="weight-input" placeholder="00.0" step="0.1">
                    <button onclick="enviarPeso()">Guardar</button>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
