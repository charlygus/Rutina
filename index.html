<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rutina</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/charts/loader.js"></script>
</head>
<body>

    <header class="minimal-header">
        <div class="header-content">
            <h1>RUTINA</h1>
            <div class="week-controls">
                <button onclick="changeWeek(-1)">←</button>
                <span id="current-week-label">Semana 3</span>
                <button onclick="changeWeek(1)">→</button>
            </div>
        </div>
    </header>

    <main>
        <div class="tabs-minimal">
            <button class="tab-link active" onclick="showTab('menu')">Menú</button>
            <button class="tab-link" onclick="showTab('shopping')">Compra</button>
            <button class="tab-link" onclick="showTab('weight')">Peso</button>
        </div>

        <div id="menu-view" class="tab-content active">
            <div id="days-container"></div>
            
            <div id="recipe-view" class="hidden-view">
                <button class="back-btn" onclick="closeRecipe()">← Volver al menú</button>
                <h2 id="recipe-day-title">Día</h2>
                <div id="recipe-cards-container"></div>
            </div>
        </div>

        <div id="shopping-view" class="tab-content">
            <div class="minimal-section">
                <div class="super-mode-banner">
                    <input type="checkbox" id="supermarket-mode" onchange="renderShopping()">
                    <label for="supermarket-mode">📦 MODO SUPERMERCADO (S3 + S4)</label>
                </div>
                <div id="shopping-list"></div>
            </div>
        </div>

        <div id="weight-view" class="tab-content">
            <div class="weight-summary">
                <div class="kpi-box">
                    <span class="kpi-label">Último Peso</span>
                    <span class="kpi-value" id="last-weight">-- kg</span>
                </div>
                <div class="kpi-box">
                    <span class="kpi-label">Progreso</span>
                    <span class="kpi-value" id="weight-trend">--</span>
                </div>
            </div>
            <div id="chart_div" class="chart-container"></div>
            <div class="weight-input-section">
                <div class="input-group">
                    <input type="number" id="weight-input" placeholder="75.5" step="0.1">
                    <button onclick="saveWeight()">Guardar</button>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
